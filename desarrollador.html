<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SERENIA · Panel desarrollador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#f3ede2; --surface:#fffdf9; --surface2:#f8f3ea; --fg:#3f2d49; --muted:#7d756b; --line:#e2d8c6;
  --salvia:#8D9B84; --salvia-d:#5f6e58; --band:#76866d; --lav:#C8B5D9; --gold:#CFA34A; --gold-d:#8f6a1c; --danger:#a8483d; --ok:#4c7a4a; --warn:#b07a12;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18161b; --surface:#221f27; --surface2:#2a2630; --fg:#efe6d8; --muted:#b0a89d; --line:#3a3641;
  --salvia:#8D9B84; --salvia-d:#b9c7b0; --band:#4f5d49; --lav:#8c7aa3; --gold:#CFA34A; --gold-d:#e0bd6c; --danger:#e0796d; --ok:#8fc48b; --warn:#e0b252; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;font-weight:400}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;line-height:1.1}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0}a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{color:var(--muted);font-size:.82rem}
/* layout */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--band);color:#fffdf9;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.side .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.side .brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.2em;font-weight:600}
.side .brand small{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:transparent;color:inherit;text-align:left;width:100%;font-size:.9rem}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{background:rgba(255,255,255,.12)}
.nav[aria-current="page"]{background:rgba(255,255,255,.22);font-weight:600}
.nav .bd{margin-left:auto;background:var(--gold);color:#2b2118;border-radius:999px;font-size:.7rem;padding:1px 8px;font-weight:600}
.side .sp{flex:1}
.main{padding:clamp(14px,3vw,30px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .sub{color:var(--muted);font-size:.85rem}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;z-index:30;align-items:center}
  .side .brand,.side .sp{display:none}
  .nav{width:auto;white-space:nowrap;padding:9px 12px}
}
/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,2.4vw,22px)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{display:grid;gap:4px}
.kpi .l{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--band);background:var(--band);color:#fffdf9;padding:9px 16px;border-radius:8px;font-size:.85rem;font-weight:500;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.alt:hover{border-color:var(--salvia)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b2118}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:.78rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.fld{display:grid;gap:4px;min-width:0}
.fld>label,.fld>.l{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea,.cell-in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld input[type=color]{padding:2px;height:38px;width:64px}
.fld input[type=checkbox]{width:auto}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.chk{display:flex;gap:8px;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.86rem;vertical-align:middle}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
td.n,th.n{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:600;border:1px solid var(--line);background:var(--surface2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--danger);border-color:var(--danger)}.pill.mu{color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-size:.86rem}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--gold);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:34px 10px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface2);border:1px solid var(--line);flex:none}
.ims{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.im{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.im img{width:100%;height:100%;object-fit:cover}
.im .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;line-height:1}
.im .t{position:absolute;left:5px;bottom:5px;background:var(--gold);color:#2b2118;font-size:.62rem;padding:0 7px;border-radius:8px;font-weight:600}
.up{display:grid;place-items:center;text-align:center;aspect-ratio:1/1;border:1.5px dashed var(--salvia);border-radius:10px;color:var(--salvia-d);font-size:.78rem;cursor:pointer;padding:6px}
.up:hover{background:var(--surface2)}
.bar{display:grid;gap:3px}
/* login */
.login{max-width:380px;margin:9vh auto;display:grid;gap:14px}
.login .logo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
/* modal / drawer */
.scrim{position:fixed;inset:0;background:rgba(20,15,25,.5);z-index:60}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:61;overflow:auto;padding:20px;display:grid;gap:14px;align-content:start;border-left:1px solid var(--line)}
.sheet.wide{width:min(820px,100%)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.86rem;z-index:90;max-width:92%;text-align:center}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.step i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2b2118;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.82rem}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.78rem;z-index:99;display:none;white-space:nowrap}
.warnbox{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:10px;padding:10px 14px;font-size:.85rem}
.okbox{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:10px;padding:10px 14px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<div id="tip" class="tip"></div>
<script>
"use strict";
const SB_URL = "https://chgisjxzyqgdwwpgpynx.supabase.co", SB_KEY = "sb_publishable_jNv4OyXLvHlBzkKAI37TZg_jKwo83xG", BUCKET = "serenia-media";
const TOK = "serenia_sb_tok", REF = "serenia_sb_ref";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cop = n => "$" + Math.round(Number(n || 0)).toLocaleString("es-CO");
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const fdate = d => d ? new Date(d).toLocaleString("es-CO", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}) : "—";
const dayKey = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); };
const ss = {
  get(k){ try{ return sessionStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ sessionStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k) }catch(e){} }
};
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, 3200); }

/* ---------- Supabase ---------- */
const sb = {
  tok(){ return ss.get(TOK) },
  async refresh(){
    const r = ss.get(REF); if(!r) return false;
    const res = await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify({refresh_token:r})});
    const j = await res.json(); if(!res.ok || !j.access_token) return false;
    ss.set(TOK, j.access_token); ss.set(REF, j.refresh_token); return true;
  },
  async req(path, {method="GET", body, prefer}={}, retry=true){
    const h = {apikey:SB_KEY, Authorization:"Bearer "+(sb.tok() || SB_KEY), "Content-Type":"application/json"};
    if(prefer) h.Prefer = prefer;
    const r = await fetch(SB_URL+path, {method, headers:h, body: body !== undefined ? JSON.stringify(body) : undefined});
    if(r.status === 401 && retry && await sb.refresh()) return sb.req(path, {method, body, prefer}, false);
    if(!r.ok){ let m = await r.text(); try{ m = JSON.parse(m).message || m }catch(e){} throw new Error(m); }
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  rpc(fn, args){ return sb.req("/rest/v1/rpc/"+fn, {method:"POST", body:args || {}}); },
  async login(email, pass){
    const res = await fetch(SB_URL+"/auth/v1/token?grant_type=password", {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify({email, password:pass})});
    const j = await res.json(); if(!res.ok || !j.access_token) throw new Error("login");
    ss.set(TOK, j.access_token); ss.set(REF, j.refresh_token);
    const a = await sb.req("/rest/v1/admins?select=user_id");
    if(!a || !a.length){ sb.logout(); throw new Error("noadmin"); }
    S.email = email;
  },
  logout(){ ss.del(TOK); ss.del(REF); },
  pub(path){ return SB_URL + "/storage/v1/object/public/" + BUCKET + "/" + path; },
  async upload(blob, path, type){
    const go = () => fetch(SB_URL+"/storage/v1/object/"+BUCKET+"/"+path, {method:"POST", headers:{apikey:SB_KEY, Authorization:"Bearer "+sb.tok(), "Content-Type":type, "x-upsert":"true"}, body:blob});
    let r = await go(); if(r.status === 401 && await sb.refresh()) r = await go();
    if(!r.ok) throw new Error("No se pudo subir la imagen: " + (await r.text()));
    return sb.pub(path);
  },
  async list(prefix){
    return sb.req("/storage/v1/object/list/"+BUCKET, {method:"POST", body:{prefix, limit:200, sortBy:{column:"created_at", order:"desc"}}});
  },
  async removeFile(path){ return sb.req("/storage/v1/object/"+BUCKET+"/"+path, {method:"DELETE"}); }
};
/* redimensiona y convierte: PNG conserva transparencia (logos); el resto va a JPEG/WebP */
function prepImage(file, {max=1600, png=false, q=.82} = {}){
  return new Promise((ok, ko) => {
    const fr = new FileReader(); fr.onerror = ko;
    fr.onload = () => { const im = new Image(); im.onerror = ko;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext("2d"); if(!png){ x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); }
        x.drawImage(im, 0, 0, c.width, c.height);
        const type = png ? "image/png" : "image/jpeg";
        c.toBlob(b => b ? ok({blob:b, type, ext: png ? "png" : "jpg"}) : ko(new Error("img")), type, q);
      }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
async function uploadFile(file, folder, opts){
  const p = await prepImage(file, opts);
  const name = uid() + Date.now().toString(36) + "." + p.ext;
  return sb.upload(p.blob, folder + "/" + name, p.type);
}

/* ---------- estado ---------- */
const STATUS = ["nuevo","confirmado","enviado","entregado","cancelado"];
const S = {tab:"resumen", sub:{}, ready:false, email:"", d:{orders:[],products:[],variants:[],categories:[],families:[],settings:{},coupons:[],moves:[],pay:{}}, sheet:null, ofilter:{st:"",pay:"",q:""}, busy:false};
async function loadAll(){
  const g = p => sb.req("/rest/v1/" + p);
  const [orders, products, variants, categories, families, st, coupons, moves, pay] = await Promise.all([
    g("orders?select=*&order=created_at.desc&limit=1000"), g("products?select=*&order=position"), g("product_variants?select=*&order=position"),
    g("categories?select=*&order=position"), g("families?select=*&order=position"), g("settings?select=key,value"),
    g("coupons?select=*&order=created_at.desc"), g("stock_movements?select=*&order=created_at.desc&limit=300"), g("payment_config?select=key,value")]);
  const settings = {}; st.forEach(r => settings[r.key] = r.value);
  const pc = {}; pay.forEach(r => pc[r.key] = r.value);
  S.d = {orders, products, variants, categories, families, settings, coupons, moves, pay:pc};
  S.ready = true;
}
const setSetting = (key, value) => sb.req("/rest/v1/settings?on_conflict=key", {method:"POST", body:[{key, value}], prefer:"resolution=merge-duplicates,return=minimal"}).then(() => { S.d.settings[key] = value; });
const setPay = (key, value) => sb.req("/rest/v1/payment_config?on_conflict=key", {method:"POST", body:[{key, value:String(value ?? ""), updated_at:new Date().toISOString()}], prefer:"resolution=merge-duplicates,return=minimal"}).then(() => { S.d.pay[key] = String(value ?? ""); });
const sv = k => { const v = S.d.settings[k]; return v == null ? "" : v; };
const isOn = k => String(sv(k)).replace(/"/g,"") === "1";
const prodOf = id => S.d.products.find(p => p.id === id);
const varsOf = id => S.d.variants.filter(v => v.product_id === id);
const lowAt = () => Math.max(0, parseInt(sv("lowStock")) || 5);
const isPaid = o => o.payment_status === "pagado";
const payPill = o => o.payment_status === "pagado" ? '<span class="pill ok">Pagado</span>' : ["declined","error","voided"].includes(o.payment_status) ? '<span class="pill bad">'+esc(o.payment_status === "declined" ? "Rechazado" : o.payment_status === "voided" ? "Anulado" : "Error")+'</span>' : '<span class="pill warn">Pendiente</span>';
const stPill = s => `<span class="pill ${s === "cancelado" ? "bad" : s === "nuevo" ? "warn" : s === "entregado" ? "ok" : "mu"}">${esc(s)}</span>`;
const ICON = {
  resumen:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  pedidos:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',
  inventario:'<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>',
  catalogo:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  promos:'<svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  marca:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>',
  pagos:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
  sistema:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
};
const TABS = [["resumen","Resumen"],["pedidos","Pedidos"],["inventario","Inventario"],["catalogo","Catálogo"],["promos","Promociones"],["marca","Marca y medios"],["pagos","Pagos"],["sistema","Sistema"]];

function csv(rows){ return rows.map(r => r.map(c => { c = String(c ?? ""); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c; }).join(",")).join("\n"); }
function download(name, text, type="text/csv"){ const b = new Blob(["﻿"+text], {type:type+";charset=utf-8"}); const u = URL.createObjectURL(b); const a = document.createElement("a"); a.href = u; a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(u), 2000); }

/* ---------- vistas ---------- */
function shell(inner){
  const nNew = S.d.orders.filter(o => o.status === "nuevo").length;
  return `<div class="shell"><aside class="side" aria-label="Módulos">
    <div class="brand"><div><b>SERENIA</b><small>Panel desarrollador</small></div></div>
    ${TABS.map(t => `<button class="nav" data-act="tab" data-id="${t[0]}" ${S.tab === t[0] ? 'aria-current="page"' : ""}>${ICON[t[0] === "promos" ? "promos" : t[0]]}<span>${t[1]}</span>${t[0] === "pedidos" && nNew ? `<span class="bd">${nNew}</span>` : ""}</button>`).join("")}
    <div class="sp"></div>

/* Resumen */
function vResumen(){
  const O = S.d.orders, paid = O.filter(isPaid);
  const now = new Date(), today = dayKey(now), m0 = new Date(now.getFullYear(), now.getMonth(), 1);
  const d7 = new Date(now.getTime() - 6*864e5); d7.setHours(0,0,0,0);
  const sum = a => a.reduce((s,o) => s + o.total, 0);
  const vToday = sum(paid.filter(o => dayKey(o.paid_at || o.created_at) === today));
  const v7 = sum(paid.filter(o => new Date(o.paid_at || o.created_at) >= d7));
  const vM = sum(paid.filter(o => new Date(o.paid_at || o.created_at) >= m0));
  const pend = O.filter(o => o.status === "nuevo");
  const avg = paid.length ? sum(paid) / paid.length : 0;
  const low = S.d.variants.filter(v => v.stock != null && v.stock <= lowAt());
  // serie 14 días
  const days = []; for(let i = 13; i >= 0; i--){ const d = new Date(now.getTime() - i*864e5); days.push({k:dayKey(d), d, v:0}); }
  paid.forEach(o => { const k = dayKey(o.paid_at || o.created_at); const x = days.find(z => z.k === k); if(x) x.v += o.total; });
  const top = {}; paid.forEach(o => (o.items || []).forEach(l => { top[l.producto] = (top[l.producto] || 0) + (l.cantidad || 0); }));
  const topL = Object.entries(top).sort((a,b) => b[1]-a[1]).slice(0,5);
  const checks = [
    ["Panel y base de datos conectados", true],
    ["Pagos en línea (Wompi) configurados", !!(S.d.pay.public_key && S.d.pay.integrity_secret && S.d.pay.events_secret)],
    ["Pago en línea activado en la tienda", isOn("payOnline")],
    ["WhatsApp real configurado", String(sv("whatsapp")).replace(/"/g,"") !== "573000000000" && !!sv("whatsapp")],
    ["Logo propio cargado", !!sv("logoUrl")],
    ["Productos con foto en Supabase", S.d.products.length > 0 && S.d.products.every(p => (p.images || []).length)],
    ["Inventario cargado (al menos una medida con stock)", S.d.variants.some(v => v.stock != null)]
  ];
  return head("Resumen", "Así va la tienda hoy") + `
  <div class="grid g4">
    <div class="card kpi"><span class="l">Ventas hoy</span><span class="v">${cop(vToday)}</span><span class="s">pagos confirmados</span></div>
    <div class="card kpi"><span class="l">Últimos 7 días</span><span class="v">${cop(v7)}</span><span class="s">${paid.filter(o => new Date(o.paid_at || o.created_at) >= d7).length} pedidos</span></div>
    <div class="card kpi"><span class="l">Este mes</span><span class="v">${cop(vM)}</span><span class="s">ticket promedio ${cop(avg)}</span></div>
    <div class="card kpi"><span class="l">Por atender</span><span class="v">${pend.length}</span><span class="s">pedidos nuevos · ${low.length} medidas con stock bajo</span></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="row sb" style="margin-bottom:8px"><h3>Ventas de los últimos 14 días</h3><span class="note">COP · pagos confirmados</span></div>${chart(days)}
      <details style="margin-top:8px"><summary class="note" style="cursor:pointer">Ver como tabla</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>Día</th><th class="n">Ventas</th></tr></thead><tbody>${days.map(x => `<tr><td>${x.d.toLocaleDateString("es-CO",{weekday:"short",day:"2-digit",month:"short"})}</td><td class="n">${cop(x.v)}</td></tr>`).join("")}</tbody></table></div></details></div>
    <div class="card"><h3 style="margin-bottom:10px">Puesta en marcha</h3><div class="grid" style="gap:8px">${checks.map(c => `<div class="row" style="gap:8px;align-items:flex-start"><span class="pill ${c[1] ? "ok" : "warn"}" style="flex:none">${c[1] ? "Listo" : "Falta"}</span><span style="flex:1;min-width:0">${c[0]}</span></div>`).join("")}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3 style="margin-bottom:8px">Pedidos recientes</h3>${O.length ? `<div class="tw"><table><tbody>${O.slice(0,6).map(o => `<tr class="click" data-act="order" data-id="${o.id}"><td>${esc(o.reference || "—")}</td><td>${esc(o.buyer_name)}</td><td class="n">${cop(o.total)}</td><td>${payPill(o)}</td></tr>`).join("")}</tbody></table></div>` : '<p class="empty">Aún no hay pedidos.</p>'}</div>
    <div class="card"><h3 style="margin-bottom:8px">Más vendidos y alertas</h3>
      ${topL.length ? topL.map(t => `<div class="row sb"><span>${esc(t[0])}</span><b>${t[1]} uds</b></div>`).join("") : '<p class="note">Cuando haya ventas pagadas verás aquí el ranking.</p>'}
      ${low.length ? `<hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div class="note" style="margin-bottom:6px">Stock bajo (≤ ${lowAt()})</div>${low.slice(0,6).map(v => `<div class="row sb"><span>${esc((prodOf(v.product_id) || {}).name || v.product_id)} · ${esc(v.label)}</span><span class="pill ${v.stock === 0 ? "bad" : "warn"}">${v.stock}</span></div>`).join("")}` : ""}</div>
  </div>`;
}
function chart(days){
  const W = 640, H = 220, L = 52, B = 26, T = 10, R = 8, iw = W-L-R, ih = H-T-B;
  const max = Math.max(1, ...days.map(d => d.v)); const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const bw = iw / days.length, gap = 6;
  let g = ""; for(let i = 0; i <= 4; i++){ const y = T + ih - ih * i/4, v = nice * i/4;
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v >= 1e6 ? (v/1e6).toFixed(1)+"M" : v >= 1e3 ? Math.round(v/1e3)+"k" : Math.round(v)}</text>`; }
  const bars = days.map((d, i) => { const h = Math.max(d.v ? 3 : 0, ih * d.v / nice), x = L + i*bw + gap/2, y = T + ih - h;
    const lbl = d.d.toLocaleDateString("es-CO", {weekday:"long", day:"numeric", month:"short"});
    return `<rect x="${x}" y="${y}" width="${bw-gap}" height="${h}" rx="3" fill="var(--salvia)" class="bar-m" data-tip="${esc(lbl)}: ${cop(d.v)}"/>
      <rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(lbl)}: ${cop(d.v)}"/>
      ${i % 2 === 0 || days.length < 8 ? `<text x="${x+(bw-gap)/2}" y="${H-8}" text-anchor="middle">${d.d.getDate()}</text>` : ""}`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas diarias de los últimos 14 días">${g}${bars}</svg>`;
}

/* Inventario */
function stockPill(v){
  if(v.stock == null) return '<span class="pill mu">Sin control</span>';
  if(v.stock === 0) return '<span class="pill bad">Agotado</span>';
  if(v.stock <= lowAt()) return '<span class="pill warn">Bajo</span>';
  return '<span class="pill ok">Disponible</span>';
}

function readHash(){
  const m = location.hash.replace(/^#\/?/, "").split("/"), t = m[0];
  if(TABS.some(x => x[0] === t)){ S.tab = t; const k = SUBK[t]; if(k) S.sub[k] = m[1] || undefined; } else S.tab = "resumen";
}
function hashNow(){ const k = SUBK[S.tab]; return "#/" + S.tab + (k && S.sub[k] ? "/" + S.sub[k] : ""); }
function pushHash(){ const h = hashNow(); if(location.hash !== h){ try{ history.pushState({}, "", h); }catch(e){} } }
window.addEventListener("popstate", () => {
  if(!S.authed) return;
  if(S.sheet){ S.sheet = null; sheetPushed = false; renderLayer(); return; }
  readHash(); render(); if(S.tab === "marca" && S.sub.marca === "lib") libLoad();
});
function renderLayer(){
  if(S.sheet && !sheetPushed){ try{ history.pushState({sheet:1}, "", location.href); sheetPushed = true; }catch(e){} }
  else if(!S.sheet && sheetPushed){ sheetPushed = false; try{ if(history.state && history.state.sheet) history.back(); }catch(e){} }
  const L = $("#layer"), old = L.querySelector(".sheet"), top = old ? old.scrollTop : 0, s = S.sheet;
  const fn = s && {order:sheetOrder, stock:sheetStock, product:sheetProduct, coupon:sheetCoupon, banner:sheetBanner}[s.type];
  L.innerHTML = fn ? `<div class="scrim" data-act="close"></div><aside class="sheet ${s.type === "product" ? "wide" : ""}" role="dialog" aria-modal="true">${fn()}</aside>` : "";
  const n = L.querySelector(".sheet"); if(n && old) n.scrollTop = top;
}
async function run(fn, ok){
  if(S.busy) return; S.busy = true;
  try{ await fn(); if(ok) toast(ok); }
  catch(e){ toast(e.message === "noadmin" ? "Sin permisos" : (e.message || "Error")); }
  finally{ S.busy = false; }
}
async function refresh(){ await loadAll(); render(); }
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "item";
S.deleted = {categories:[], families:[]}; S.lib = null;

/* ---------- acciones ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch(a){
    case "tab": S.tab = d.id; S.sheet = null; pushHash(); render(); window.scrollTo(0, 0); if(d.id === "marca" && S.sub.marca === "lib") libLoad(); break;
    case "sub": S.sub[d.k] = d.id; pushHash(); render(); if(d.k === "marca" && d.id === "lib") libLoad(); break;
    case "logout": sb.logout(); S.authed = false; S.ready = false; S.sheet = null; render(); break;
    case "reload": run(refresh, "Datos actualizados"); break;
    case "close": S.sheet = null; renderLayer(); break;
    case "eye": { const i = document.getElementById(d.for); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Ver" : "Ocultar"; break; }
    /* pedidos */
    case "order": S.sheet = {type:"order", id:d.id}; renderLayer(); break;
    case "o-confirm": run(async () => { await sb.rpc("admin_confirm_order", {p_order:d.id}); await refresh(); renderLayer(); }, "Pago confirmado y stock descontado"); break;
    case "o-cancel": if(!confirm("¿Cancelar el pedido y devolver las unidades al inventario?")) break;
      run(async () => { const o = S.d.orders.find(x => x.id === d.id);
        for(const l of (o.items || [])){ if(l.vid && l.cantidad) await sb.rpc("adjust_stock", {p_variant:l.vid, p_delta:l.cantidad, p_kind:"devolucion", p_note:"Cancelación " + (o.reference || "")}); }
        await sb.req("/rest/v1/orders?id=eq." + d.id, {method:"PATCH", body:{status:"cancelado", stock_applied:false}, prefer:"return=minimal"});
        await refresh(); renderLayer(); }, "Pedido cancelado y stock devuelto"); break;
    case "exp-orders": download("pedidos-serenia.csv", csv([["Fecha","Referencia","Cliente","Celular","Correo","Ciudad","Dirección","Productos","Subtotal","Descuento","Envío","Total","Método","Pago","Estado"]].concat(S.d.orders.map(o => [o.created_at, o.reference, o.buyer_name, o.buyer_phone, o.buyer_email, o.buyer_city, o.buyer_address, (o.items || []).map(l => l.cantidad + "x " + l.producto + " (" + l.medida + ")").join(" | "), o.subtotal, o.discount, o.shipping, o.total, o.payment_method, o.payment_status, o.status])))); break;
    case "exp-stock": download("inventario-serenia.csv", csv([["Producto","Medida","Precio","Stock"]].concat(S.d.variants.map(v => [(prodOf(v.product_id) || {}).name, v.label, v.price, v.stock == null ? "ilimitado" : v.stock])))); break;
    case "exp-backup": download("serenia-respaldo.json", JSON.stringify({fecha:new Date().toISOString(), products:S.d.products, variants:S.d.variants, categories:S.d.categories, families:S.d.families, settings:S.d.settings, coupons:S.d.coupons}, null, 2), "application/json"); break;
    /* inventario */
    case "stock": S.sheet = {type:"stock", id:d.id, draft:{kind:"entrada", delta:"", note:""}}; renderLayer(); break;
    case "stock-save": run(async () => { const dr = S.sheet.draft, n = parseInt(dr.delta); if(!n) throw new Error("Escribe una cantidad distinta de 0");
        await sb.rpc("adjust_stock", {p_variant:S.sheet.id, p_delta:n, p_kind:dr.kind, p_note:dr.note}); S.sheet = null; await refresh(); renderLayer(); }, "Stock actualizado"); break;
    case "stock-unl": run(async () => { await sb.req("/rest/v1/product_variants?id=eq." + encodeURIComponent(S.sheet.id), {method:"PATCH", body:{stock:null}, prefer:"return=minimal"}); S.sheet = null; await refresh(); renderLayer(); }, "Sin control de stock"); break;
    /* catálogo */
    case "pnew": S.sheet = {type:"product", isNew:true, draft:{id:"", name:"", category_id:(S.d.categories[0] || {}).id || "", family_id:"", aroma:"", color_name:"", color:"#c9b5a0", description:"", triangle:"", featured:false, active:true, images:[], variants:[{id:"", label:"", weight_g:"", price:"", stock:""}]}, removed:[]}; renderLayer(); break;
    case "pedit": { const p = prodOf(d.id); S.sheet = {type:"product", isNew:false, draft:Object.assign(clone(p), {images:clone(p.images || []), variants:varsOf(p.id).map(v => clone(v))}), removed:[]}; renderLayer(); break; }
    case "pimg-del": S.sheet.draft.images.splice(+d.i, 1); renderLayer(); break;
    case "pimg-first": { const im = S.sheet.draft.images.splice(+d.i, 1)[0]; S.sheet.draft.images.unshift(im); renderLayer(); break; }
    case "pvar-add": S.sheet.draft.variants.push({id:"", label:"", weight_g:"", price:"", stock:""}); renderLayer(); break;
    case "pvar-del": { const v = S.sheet.draft.variants.splice(+d.i, 1)[0]; if(v.id) S.sheet.removed.push(v.id); renderLayer(); break; }
    case "psave": run(saveProduct, "Producto guardado"); break;
    case "pdel": if(!confirm("¿Eliminar este producto y todas sus medidas?")) break;
      run(async () => { const id = S.sheet.draft.id; await sb.req("/rest/v1/product_variants?product_id=eq." + encodeURIComponent(id), {method:"DELETE"}); await sb.req("/rest/v1/products?id=eq." + encodeURIComponent(id), {method:"DELETE"}); S.sheet = null; await refresh(); }, "Producto eliminado"); break;
    case "ladd": S.d[d.k].push(d.k === "categories" ? {id:"", name:"Nuevo tipo", image:""} : {id:"", name:"Nuevo aroma", color:"#c9b5a0"}); render(); break;
    case "ldel": { const it = S.d[d.k].splice(+d.i, 1)[0]; if(it.id) S.deleted[d.k].push(it.id); render(); break; }
    case "lmove": { const L = S.d[d.k], i = +d.i; if(i > 0){ [L[i-1], L[i]] = [L[i], L[i-1]]; render(); } break; }
    case "lsave": run(async () => { const k = d.k, rows = S.d[k].map((x, i) => { const id = x.id || (slug(x.name) + "-" + uid().slice(0, 3)); x.id = id; return k === "categories" ? {id, name:x.name, image:x.image || "", position:i} : {id, name:x.name, color:x.color || "#c9b5a0", position:i}; });
        if(rows.length) await sb.req("/rest/v1/" + k + "?on_conflict=id", {method:"POST", body:rows, prefer:"resolution=merge-duplicates,return=minimal"});
        if(S.deleted[k].length) await sb.req("/rest/v1/" + k + "?id=in.(" + S.deleted[k].map(i => '"' + i.replace(/"/g, "") + '"').join(",") + ")", {method:"DELETE"});
        S.deleted[k] = []; await refresh(); }, "Guardado"); break;
    /* promociones */
    case "cnew": S.sheet = {type:"coupon", isNew:true, draft:{code:"", kind:"percent", value:10, min_total:0, starts_at:"", ends_at:"", max_uses:"", active:true, note:""}}; renderLayer(); break;
    case "cedit": { const c = S.d.coupons.find(x => x.code === d.id); S.sheet = {type:"coupon", isNew:false, draft:Object.assign(clone(c), {starts_at:c.starts_at ? c.starts_at.slice(0, 10) : "", ends_at:c.ends_at ? c.ends_at.slice(0, 10) : "", max_uses:c.max_uses ?? ""})}; renderLayer(); break; }
    case "csave": run(async () => { const c = S.sheet.draft, code = String(c.code).trim().toUpperCase().replace(/\s+/g, "");
        if(!code) throw new Error("Escribe el código"); if(!(+c.value > 0)) throw new Error("El valor debe ser mayor a 0"); if(c.kind === "percent" && +c.value > 100) throw new Error("El porcentaje no puede pasar de 100");
        const row = {code, kind:c.kind, value:+c.value, min_total:+c.min_total || 0, active:!!c.active, starts_at:c.starts_at ? c.starts_at + "T00:00:00-05:00" : null, ends_at:c.ends_at ? c.ends_at + "T23:59:59-05:00" : null, max_uses:c.max_uses === "" ? null : +c.max_uses, note:c.note || ""};
        await sb.req("/rest/v1/coupons?on_conflict=code", {method:"POST", body:[row], prefer:"resolution=merge-duplicates,return=minimal"}); S.sheet = null; await refresh(); }, "Cupón guardado"); break;
    case "cdel": if(!confirm("¿Eliminar este cupón?")) break; run(async () => { await sb.req("/rest/v1/coupons?code=eq." + encodeURIComponent(S.sheet.draft.code), {method:"DELETE"}); S.sheet = null; await refresh(); }, "Cupón eliminado"); break;
    case "bnew": S.sheet = {type:"banner", isNew:true, idx:-1, draft:{id:uid(), img:"", title:"", sub:"", link:"/velas", cta:"Ver ahora", from:"", to:"", active:true}}; renderLayer(); break;
    case "bedit": S.sheet = {type:"banner", isNew:false, idx:+d.i, draft:Object.assign({cta:"", from:"", to:""}, clone(bannersList()[+d.i]))}; renderLayer(); break;
    case "bimg-del": S.sheet.draft.img = ""; renderLayer(); break;
    case "bsave": run(async () => { const B = clone(bannersList()), x = S.sheet.draft; if(!x.img) throw new Error("Sube una imagen para el banner");
        if(S.sheet.isNew) B.push(x); else B[S.sheet.idx] = x; await setSetting("banners", B); S.sheet = null; render(); }, "Banner guardado"); break;
    case "bdel": if(!confirm("¿Quitar este banner?")) break; run(async () => { const B = clone(bannersList()); B.splice(+d.i, 1); await setSetting("banners", B); render(); }, "Banner quitado"); break;
    case "bmove": run(async () => { const B = clone(bannersList()), i = +d.i; if(i > 0){ [B[i-1], B[i]] = [B[i], B[i-1]]; await setSetting("banners", B); render(); } }); break;
    /* marca */
    case "slot-del": run(async () => { await setSetting(d.key, ""); render(); }, "Imagen quitada"); break;
    case "sk-save": run(async () => { for(const k of d.keys.split(",")){ const el = document.getElementById("sk-" + k); if(!el) continue; await setSetting(k, el.type === "number" ? (el.value === "" ? 0 : +el.value) : el.value); } render(); }, "Cambios guardados"); break;
    case "lib-load": libLoad(); break;
    case "lib-copy": (navigator.clipboard ? navigator.clipboard.writeText(d.url) : Promise.reject()).then(() => toast("Enlace copiado"), () => toast(d.url)); break;
    case "lib-del": if(!confirm("¿Borrar esta imagen? Si algún producto la usa dejará de verse.")) break; run(async () => { await sb.removeFile(d.path); await libLoad(); }, "Imagen borrada"); break;
    /* pagos */
    case "pay-save": run(async () => { for(const el of document.querySelectorAll("[data-pay]")) await setPay(el.dataset.pay, el.value.trim()); render(); }, "Configuración de pagos guardada"); break;
    case "pay-test": run(async () => { const k = (document.querySelector('[data-pay="public_key"]').value || "").trim(); if(!k) throw new Error("Escribe la llave pública");
        const host = k.startsWith("pub_test") ? "https://sandbox.wompi.co" : "https://production.wompi.co"; const r = await fetch(host + "/v1/merchants/" + encodeURIComponent(k)); const j = await r.json();
        const m = $("#paymsg"); if(!r.ok || !j.data) { m.textContent = "Wompi no reconoce esa llave."; throw new Error("Llave no válida"); }
        m.textContent = "Comercio: " + (j.data.name || j.data.legal_name || "OK") + " · " + (k.startsWith("pub_test") ? "modo pruebas" : "producción"); }, "Llave verificada"); break;
  }
});
async function saveProduct(){
  const d = S.sheet.draft; if(!d.name.trim()) throw new Error("Escribe el nombre");
  const vs = d.variants.filter(v => String(v.label).trim()); if(!vs.length) throw new Error("Agrega al menos una medida con nombre");
  const id = d.id || (slug(d.name) + "-" + uid().slice(0, 3));
  const pos = d.position ?? (S.d.products.reduce((m, p) => Math.max(m, p.position || 0), -1) + 1);
  await sb.req("/rest/v1/products?on_conflict=id", {method:"POST", prefer:"resolution=merge-duplicates,return=minimal", body:[{id, name:d.name.trim(), category_id:d.category_id || null, family_id:d.family_id || null, aroma:d.aroma || "", color_name:d.color_name || "", color:d.color || "#c9b5a0", description:d.description || "", triangle:d.triangle || "", featured:!!d.featured, active:!!d.active, images:d.images || [], size_guide:d.size_guide || "", position:pos}]});
  const rows = vs.map((v, i) => ({id:v.id || (id.slice(0, 20) + "-" + uid().slice(0, 4)), product_id:id, label:String(v.label).trim(), weight_g:v.weight_g === "" || v.weight_g == null ? null : +v.weight_g, price:Math.round(+v.price) || 0, stock:v.stock === "" || v.stock == null ? null : Math.max(0, Math.round(+v.stock)), position:i}));
  await sb.req("/rest/v1/product_variants?on_conflict=id", {method:"POST", prefer:"resolution=merge-duplicates,return=minimal", body:rows});
  if(S.sheet.removed.length) await sb.req("/rest/v1/product_variants?id=in.(" + S.sheet.removed.map(i => '"' + i.replace(/"/g, "") + '"').join(",") + ")", {method:"DELETE"});
  S.sheet = null; await refresh();
}
async function libLoad(){
  S.lib = null; if(S.tab === "marca") render();
  try{
    const out = [];
    for(const f of ["brand", "products", "banners", "categories", "library"]){
      const items = await sb.list(f); (items || []).filter(i => i.id).forEach(i => out.push({path:f + "/" + i.name, url:sb.pub(f + "/" + i.name), t:i.created_at}));
    }
    out.sort((a, b) => String(b.t).localeCompare(String(a.t))); S.lib = out;
  }catch(e){ S.lib = []; toast("No se pudo leer la biblioteca"); }
  if(S.tab === "marca" && S.sub.marca === "lib") render();
}

/* ---------- campos ---------- */
function setPath(obj, k, el){ obj[k] = el.type === "checkbox" ? el.checked : el.value; }
document.addEventListener("input", e => {
  const el = e.target, ds = el.dataset;
  if(ds.pd !== undefined && S.sheet) return setPath(S.sheet.draft, ds.pd, el);
  if(ds.vd !== undefined && S.sheet) { S.sheet.draft.variants[+ds.vd][ds.k] = el.value; return; }
  if(ds.cd !== undefined && S.sheet) return setPath(S.sheet.draft, ds.cd, el);
  if(ds.bd !== undefined && S.sheet) return setPath(S.sheet.draft, ds.bd, el);
  if(ds.sd !== undefined && S.sheet) { S.sheet.draft[ds.sd] = el.value; return; }
  if(ds.lname !== undefined) { S.d[ds.lname][+ds.i].name = el.value; return; }
  if(ds.lcolor !== undefined) { S.d.families[+ds.lcolor].color = el.value; return; }
  if(ds.of !== undefined){ S.ofilter[ds.of] = el.value; const p = el.selectionStart; render(); if(ds.of === "q"){ const n = $("#of-q"); if(n){ n.focus(); n.setSelectionRange(p, p); } } }
});
document.addEventListener("change", async e => {
  const el = e.target, ds = el.dataset;
  if(ds.tog){ run(async () => { await sb.req("/rest/v1/products?id=eq." + encodeURIComponent(ds.id), {method:"PATCH", body:{[ds.tog]:el.checked}, prefer:"return=minimal"}); prodOf(ds.id)[ds.tog] = el.checked; }, "Actualizado"); return; }
  if(ds.toggle){ if(ds.toggle === "payOnline" && el.checked && !(S.d.pay.public_key && S.d.pay.integrity_secret && S.d.pay.events_secret)){ el.checked = false; toast("Primero guarda las llaves de Wompi"); return; }
    run(async () => { await setSetting(ds.toggle, el.checked ? "1" : "0"); render(); }, el.checked ? "Activado" : "Desactivado"); return; }
  if(ds.setting){ run(async () => { await setSetting(ds.setting, String(el.value)); render(); }, "Guardado"); return; }
  if(ds.ostate){ run(async () => { await sb.req("/rest/v1/orders?id=eq." + ds.ostate, {method:"PATCH", body:{status:el.value}, prefer:"return=minimal"}); S.d.orders.find(o => o.id === ds.ostate).status = el.value; render(); renderLayer(); }, "Estado actualizado"); return; }
  if(ds.onotes){ run(async () => { await sb.req("/rest/v1/orders?id=eq." + ds.onotes, {method:"PATCH", body:{notes:el.value}, prefer:"return=minimal"}); S.d.orders.find(o => o.id === ds.onotes).notes = el.value; }, "Nota guardada"); return; }
  /* subidas */
  const files = el.files ? [...el.files] : []; if(!files.length) return;
  const up = async (folder, opts) => { toast("Subiendo imagen…"); const urls = []; for(const f of files) urls.push(await uploadFile(f, folder, opts)); el.value = ""; return urls; };
  if(ds.pup){ run(async () => { const u = await up("products"); S.sheet.draft.images.push(...u); renderLayer(); }, "Fotos subidas"); }
  else if(ds.bup){ run(async () => { const u = await up("banners", {max:1800}); S.sheet.draft.img = u[0]; renderLayer(); }, "Imagen subida"); }
  else if(ds.lup !== undefined){ run(async () => { const u = await up("categories", {max:800}); S.d.categories[+ds.lup].image = u[0]; render(); }, "Foto subida (guarda los cambios)"); }
  else if(ds.slot){ run(async () => { const u = await up("brand", ds.opts === "logo" ? {max:900, png:true} : {max:2000}); await setSetting(ds.slot, u[0]); render(); }, "Imagen guardada"); }
  else if(ds.libup){ run(async () => { await up("library", {max:2000}); await libLoad(); }, "Imágenes subidas"); }
});
document.addEventListener("submit", e => {
  if(e.target.id === "lf"){ e.preventDefault();
    sb.login($("#le").value.trim(), $("#lp").value).then(async () => { S.authed = true; S.loginMsg = ""; render(); try{ await loadAll(); }catch(er){ toast(er.message); } render(); })
      .catch(er => { S.loginMsg = er.message === "noadmin" ? "Esta cuenta no está registrada como administradora." : "Correo o clave incorrectos."; render(); }); }
});
/* tooltips de gráficos */
document.addEventListener("mousemove", e => { const t = $("#tip"), n = e.target.closest ? e.target.closest("[data-tip]") : null; if(!n){ t.style.display = "none"; return; } t.textContent = n.dataset.tip; t.style.display = "block"; t.style.left = Math.min(innerWidth - t.offsetWidth - 8, e.clientX + 12) + "px"; t.style.top = (e.clientY + 14) + "px"; });
document.addEventListener("keydown", e => { if(e.key === "Escape" && S.sheet){ S.sheet = null; renderLayer(); } });

/* ---------- arranque ---------- */
(async () => {
  readHash(); try{ history.replaceState({}, "", hashNow()); }catch(e){}
  if(sb.tok()){
    try{ const a = await sb.req("/rest/v1/admins?select=user_id"); if(a && a.length){ S.authed = true; render(); await loadAll(); render(); return; } }catch(e){}
    sb.logout();
  }
  S.authed = false; render();
})();
</script>
</body>
</html>
