<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SERENIA Velas Aromáticas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: tienda tipo catálogo (inicio, categoría, detalle de producto, carrito lateral) + módulo de administración en #/admin */
:root{
  --bg:#f5f0e9; --surface:#fbf8f3; --fg:#4a443c; --muted:#85796c; --tan:#c9b5a0; --tan-deep:#a98c6d;
  --sage:#6f8467; --accent:#b8793a; --line:#e2d8cb; --on-tan:#fffdf9; --danger:#a8483d; --band:#c9b5a0;
  --display:"Cormorant Garamond","Times New Roman",serif;
  --body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1714; --surface:#221e1a; --fg:#ece4d9; --muted:#b3a696; --tan:#7e6b58; --tan-deep:#d2b490;
  --sage:#9bb392; --accent:#e0a35f; --line:#383129; --on-tan:#fffdf9; --danger:#e0796d; --band:#5b4d40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1714; --surface:#221e1a; --fg:#ece4d9; --muted:#b3a696; --tan:#7e6b58; --tan-deep:#d2b490;
  --sage:#9bb392; --accent:#e0a35f; --line:#383129; --on-tan:#fffdf9; --danger:#e0796d; --band:#5b4d40; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;font-weight:300;line-height:1.6;margin:0}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1140px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tan-deep);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* cabecera */
.announce{background:var(--surface);border-bottom:1px solid var(--line);text-align:center;padding:10px 16px;font-family:var(--display);font-style:italic;font-size:1.2rem;color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--tan);color:var(--on-tan)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{font-family:var(--display);font-size:1.8rem;letter-spacing:.28em;text-decoration:none;font-weight:500;margin-right:auto}
.ico{background:transparent;border:0;color:inherit;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative}
.ico:hover{background:rgba(255,255,255,.18)}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;right:0;background:var(--fg);color:var(--bg);font-size:.68rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.dnav{display:flex;gap:22px}
.dnav a{text-decoration:none;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
.dnav a:hover{text-decoration:underline;text-underline-offset:6px}
.searchbar{background:var(--surface);border-bottom:1px solid var(--line)}
.searchbar form{display:flex;gap:10px;padding-block:12px}
.searchbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 18px}
.menu{position:fixed;inset:0;z-index:40;display:flex}
.menu nav{width:min(320px,86%);background:var(--bg);padding:24px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.menu nav a{text-decoration:none;font-family:var(--display);font-size:1.5rem;padding:6px 0;border-bottom:1px solid var(--line)}
.menu .sc{flex:1;background:rgba(30,25,20,.45)}
@media (min-width:900px){.burger{display:none}}
@media (max-width:899px){.dnav{display:none}}

/* botones */
.btn{display:inline-block;border:1px solid var(--tan-deep);background:var(--tan-deep);color:var(--on-tan);padding:13px 28px;text-decoration:none;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;font-weight:400;border-radius:2px;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--tan-deep)}
.btn.wa{background:#25a65a;border-color:#25a65a}
.btn.block{display:block;width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn.sm{padding:8px 16px;font-size:.75rem}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}

/* inicio */
.hero{position:relative;display:grid;place-items:center;text-align:center;min-height:clamp(380px,62vw,560px);background:linear-gradient(160deg,#e9dccb,#d8c4ac);overflow:hidden;color:#5a2f2f}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .in{position:relative;padding:32px 16px;display:grid;gap:14px;justify-items:center}
.hero .k{font-size:1.25rem;font-family:var(--display)}
.hero h1{font-size:clamp(3.4rem,13vw,6.4rem);letter-spacing:.04em;font-weight:400}
.hero .s{font-size:clamp(1.6rem,5vw,2.6rem);font-family:var(--display);border-top:1px solid currentColor;padding-top:10px}
.hero.img{color:#fff}
.hero.img .in{background:rgba(30,22,14,.32);border-radius:4px}
.sec{padding-block:clamp(44px,7vw,88px)}
.sec-t{text-align:center;display:grid;gap:12px;justify-items:center;margin-bottom:clamp(28px,5vw,48px)}
.sec-t h2{font-size:clamp(2rem,5vw,3.2rem);color:var(--tan-deep);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.sec-t p{max-width:54ch;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(20px,4vw,40px) 20px}
.cat{display:grid;gap:14px;justify-items:center;text-decoration:none;text-align:center}
.oval{width:min(100%,220px);aspect-ratio:3/4;border-radius:50% 50% 50% 50%/42% 42% 58% 58%;background:var(--tan);overflow:hidden;display:grid;place-items:center}
.oval img{width:100%;height:100%;object-fit:cover}
.oval svg{width:64%;height:auto}
.cat span{letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
.cat:hover span{color:var(--fg)}
.band{background:var(--band);color:#fff}
.band .sec-t h2{color:#fff}
.band .sec-t p{color:rgba(255,255,255,.88)}
.fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:880px;margin-inline:auto}
.fam{display:flex;align-items:center;gap:16px;text-decoration:none;padding:16px 18px;background:rgba(255,255,255,.14);border-radius:2px}
.fam i{width:10px;height:44px;border-radius:2px;flex:none}
.fam span{letter-spacing:.2em;text-transform:uppercase;font-size:.85rem}
.fam:hover{background:rgba(255,255,255,.24)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;text-align:center}
.perks b{font-family:var(--display);font-size:1.5rem;font-weight:500;display:block}
.perks span{color:var(--muted);font-size:.92rem}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:clamp(16px,3vw,28px)}
.pc{display:grid;gap:8px;text-decoration:none;align-content:start;min-width:0}
.pc .ph{aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.pc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pc:hover .ph img{transform:scale(1.04)}
.pc .ph svg{width:46%;height:auto}
.pc h3{font-size:1.35rem;text-align:center;font-weight:500;padding-top:6px}
.pc .pr{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.pc .tag{justify-self:center;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tan-deep)}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.crumbs{font-size:.8rem;color:var(--muted);letter-spacing:.06em;padding-block:20px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--tan);background:transparent;border-radius:999px;padding:7px 18px;font-size:.85rem;letter-spacing:.04em}
.chip[aria-pressed="true"]{background:var(--tan);color:var(--on-tan)}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.lhead h1{font-size:clamp(2.2rem,5vw,3.4rem);color:var(--tan-deep)}
.filters{display:grid;gap:14px;margin-bottom:28px;padding:16px 18px;background:var(--surface);border:1px solid var(--line)}
.frow{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap}
.frow .lab{margin:0;min-width:92px}
.size{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 10px;border-radius:2px}

/* detalle */
.pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
.gal .main{aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.gal .main img{width:100%;height:100%;object-fit:cover}
.gal .main svg{width:48%;height:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:8px}
.thumbs button{padding:0;border:1px solid var(--line);background:var(--surface);aspect-ratio:1/1;overflow:hidden}
.thumbs button[aria-current="true"]{border-color:var(--tan-deep);outline:1px solid var(--tan-deep)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{display:grid;gap:18px}
.info h1{font-size:clamp(2.2rem,5vw,3.2rem)}
.info .d{color:var(--muted)}
.tri{color:var(--tan-deep)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{border:1px solid var(--tan);background:transparent;border-radius:999px;padding:9px 20px;font-size:.92rem;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--tan);color:var(--on-tan)}
.opt[disabled]{opacity:.4;text-decoration:line-through}
.lab{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.price{font-family:var(--display);font-size:2.2rem;font-variant-numeric:tabular-nums;line-height:1}
.price small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);margin-top:4px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--tan)}
.qty button{width:40px;height:42px;background:transparent;border:0;font-size:1.2rem}
.qty span{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.buys{display:grid;gap:10px}
.box{background:var(--tan);color:var(--on-tan);border-radius:18px;padding:22px 24px;display:grid;gap:8px}
.box h3{font-size:1.6rem}
.box b{font-weight:500}
.spec{display:grid;gap:6px;font-family:var(--display);font-size:1.3rem}
.spec b{color:var(--tan-deep);font-weight:500}
.guide{border:1px solid var(--line);background:var(--surface);padding:16px;display:grid;gap:12px}
.guide img{margin-inline:auto;max-height:420px;object-fit:contain}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.92rem;white-space:nowrap}
th{font-weight:500;color:var(--muted);letter-spacing:.06em;font-size:.76rem;text-transform:uppercase}
@media (max-width:820px){.pd{grid-template-columns:minmax(0,1fr)}}

/* pie */
footer{background:var(--surface);border-top:1px solid var(--line);margin-top:40px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;padding-block:48px 24px}
.fgrid h4{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;font-family:var(--body);font-weight:400;margin-bottom:12px;color:var(--fg)}
.fgrid a{display:block;text-decoration:none;color:var(--tan-deep);padding:4px 0}
.fgrid a:hover{text-decoration:underline}
.news{display:flex;margin-top:10px}
.news input{flex:1;min-width:0;border:1px solid var(--tan);background:var(--bg);padding:10px 12px;border-right:0}
.news button{border:0;background:var(--accent);color:#fff;padding:0 18px;letter-spacing:.1em;font-size:.78rem;text-transform:uppercase}
.copy{border-top:1px solid var(--line);padding-block:18px;font-size:.8rem;color:var(--muted);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.wafab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25a65a;display:grid;place-items:center;z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.wafab svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}

/* carrito */
.scrim{position:fixed;inset:0;background:rgba(30,25,20,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.8rem}
.lines{flex:1;overflow-y:auto;padding:12px 20px;display:grid;gap:14px;align-content:start}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}
.line .t{width:64px;height:64px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.line .t img{width:100%;height:100%;object-fit:cover}
.line .t svg{width:70%;height:auto}
.line .n{font-family:var(--display);font-size:1.2rem;line-height:1.15}
.line .s{font-size:.8rem;color:var(--muted)}
.line .qty button{width:30px;height:30px}
.line .qty span{min-width:26px}
.dfoot{border-top:1px solid var(--line);padding:16px 20px 20px;display:grid;gap:10px}
.dfoot label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px}
.dfoot input{border:1px solid var(--line);background:var(--surface);padding:9px 12px;width:100%}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.ship{font-size:.82rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sage)}
.note{font-size:.76rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:80;max-width:92%;text-align:center}

/* administrador */
.adm{padding-block:24px 40px}
.adm h1{font-size:2.4rem}
.atop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 16px;font-size:.88rem;letter-spacing:.06em}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);padding:clamp(14px,3vw,24px);display:grid;gap:18px}
.login{max-width:380px;margin:60px auto;display:grid;gap:14px}
.fld{display:grid;gap:4px;min-width:0}
.fld>label,.fld>.l{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea,.adm td input{border:1px solid var(--line);background:var(--bg);padding:9px 11px;width:100%;min-width:0;border-radius:2px}
.fld textarea{min-height:92px;resize:vertical}
.fld input[type=color]{padding:2px;height:40px;width:70px}
.fld input[type=checkbox]{width:auto}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.chk{display:flex;gap:18px;flex-wrap:wrap}
.chk label{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--fg);letter-spacing:0;text-transform:none}
.ims{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.im{position:relative;aspect-ratio:1/1;border:1px solid var(--line);background:var(--bg)}
.im img{width:100%;height:100%;object-fit:cover}
.im button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);line-height:1}
.im span{position:absolute;left:4px;bottom:4px;font-size:.65rem;background:var(--fg);color:var(--bg);padding:0 6px;border-radius:8px}
.up{display:grid;place-items:center;aspect-ratio:1/1;border:1px dashed var(--tan-deep);color:var(--tan-deep);font-size:.8rem;text-align:center;cursor:pointer;padding:6px}
.vt td{padding:6px 6px}
.vt td:first-child{min-width:150px}
.vt td input{min-width:80px}
.plist{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;background:var(--bg);border:1px solid var(--line)}
.prow .t{width:56px;height:56px;overflow:hidden;background:var(--surface);display:grid;place-items:center}
.prow .t img{width:100%;height:100%;object-fit:cover}
.prow .t svg{width:70%}
.prow b{font-family:var(--display);font-size:1.25rem;font-weight:500}
.prow .m{font-size:.82rem;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 10px;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:middle}
.pill.on{border-color:var(--sage);color:var(--sage)}
.pill.off{border-color:var(--danger);color:var(--danger)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.lrow.c{grid-template-columns:48px minmax(0,1fr) auto auto}
.lrow input[type=text]{border:1px solid var(--line);background:var(--bg);padding:9px 11px;min-width:0}
.cimg{width:48px;height:48px;border:1px dashed var(--tan-deep);display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:.6rem;color:var(--tan-deep);text-align:center}
.cimg img{width:100%;height:100%;object-fit:cover}
textarea.json{width:100%;min-height:180px;font-family:ui-monospace,monospace;font-size:.78rem;border:1px solid var(--line);background:var(--bg);padding:10px}
@media (max-width:560px){.prow{grid-template-columns:48px minmax(0,1fr)}.prow .acts{grid-column:1/-1;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =====================================================================
   SERENIA · tienda + administrador (un solo archivo)
   Datos: hoy se guardan en el navegador (localStorage).
   Para conectar Supabase después, solo hay que reemplazar el objeto
   "Store" (load / save) por llamadas a las tablas products, categories,
   families y settings. El resto de la página no cambia.
   ===================================================================== */
const KEY = "serenia_data_v2", CART_KEY = "serenia_cart_v2", SESSION_KEY = "serenia_admin";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cop = n => "$" + Number(n || 0).toLocaleString("es-CO");
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const ls = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v); return true }catch(e){ return false } },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }

/* ---------- datos de ejemplo ---------- */

let path = "/", listFilter = "", listType = "", listSort = "", searchOpen = false, menuOpen = false, cartOpen = false;
function parse(h){ return (h||"").replace(/^#/,"") || "/"; }
function go(p){
  if(p === path){ render(); return; }
  path = p; try{ history.replaceState(null,"","#"+p) }catch(e){ try{ location.hash = p }catch(_e){} }
  listFilter = ""; listType = ""; listSort = ""; menuOpen = false; render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{ const p = parse(location.hash); if(p !== path){ path = p; listFilter=""; listType=""; listSort=""; menuOpen=false; render(); window.scrollTo(0,0); } });
const link = (p, inner, cls="") => `<a class="${cls}" href="#${esc(p)}" data-go="${esc(p)}">${inner}</a>`;

function vList(title, items, opts={}){
  const fams = opts.filterFams ? D.families.filter(f=>items.some(p=>p.familyId===f.id)) : [];
  const types = opts.filterTypes ? D.categories.filter(c=>items.some(p=>p.categoryId===c.id)) : [];
  let shown = items.filter(p=>(!listFilter||p.familyId===listFilter)&&(!listType||p.categoryId===listType));
  if(listSort==="asc") shown = [...shown].sort((a,b)=>minPrice(a)-minPrice(b));
  if(listSort==="desc") shown = [...shown].sort((a,b)=>minPrice(b)-minPrice(a));
  const chips = (kind,label,arr,cur) => arr.length>1 ? `<div class="frow"><span class="lab">${label}</span><div class="chips" role="group" aria-label="${label}"><button class="chip" data-act="fil" data-kind="${kind}" data-id="" aria-pressed="${!cur}">Todos</button>${arr.map(x=>`<button class="chip" data-act="fil" data-kind="${kind}" data-id="${esc(x.id)}" aria-pressed="${cur===x.id}">${esc(x.name)}</button>`).join("")}</div></div>` : "";
  const hasF = fams.length>1 || types.length>1;
  return `<div class="wrap"><div class="crumbs">${link("/","Inicio")} / ${esc(title)}</div>
    <div class="lhead"><h1>${esc(title)}</h1><span class="note">${shown.length} ${shown.length===1?"vela":"velas"}</span></div>
    ${hasF||items.length>1?`<div class="filters">${chips("type","Tipo de vela",types,listType)}${chips("fam","Aroma",fams,listFilter)}
      <div class="frow"><label class="lab" for="lsort">Ordenar</label><select id="lsort" class="size"><option value="" ${!listSort?"selected":""}>Destacados</option><option value="asc" ${listSort==="asc"?"selected":""}>Precio: menor a mayor</option><option value="desc" ${listSort==="desc"?"selected":""}>Precio: mayor a menor</option></select></div></div>`:""}
    ${shown.length?`<div class="grid">${shown.map(card).join("")}</div>`:`<p class="empty">${opts.empty||"No hay velas con esos filtros."}</p>`}</div>`;
}

const cartLines = () => cart.map(l=>{ const p=prod(l.pid); const v=p&&p.variants.find(x=>x.id===l.vid); return p&&v?{...l,p,v}:null }).filter(Boolean);
function addToCart(pid, open){
  const p = prod(pid); const v = p.variants.find(x=>x.id===sel.vid) || p.variants[0]; if(!v) return;
  const ex = cart.find(l=>l.pid===pid && l.vid===v.id);

/* ---------- imágenes ---------- */
function readImg(file, max=900, q=0.78){
  return new Promise((ok,ko)=>{
    const fr = new FileReader();
    fr.onerror = ko;
    fr.onload = () => { const im = new Image(); im.onerror = ko;
      im.onload = () => { const k = Math.min(1, max/Math.max(im.width,im.height)); const c = document.createElement("canvas");
        c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",q)); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g && !e.target.closest("[data-act]")){ e.preventDefault(); cartOpen=false; searchOpen=false; go(g.dataset.go); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch(a){
    case "menu": menuOpen = true; renderLayer(); break;
    case "closemenu": menuOpen = false; renderLayer(); break;
    case "search": searchOpen = !searchOpen; render(); break;
    case "cart": cartOpen = true; renderLayer(); break;
    case "closecart": cartOpen = false; renderLayer(); break;
    case "fil": if(d.kind==="type") listType = d.id; else listFilter = d.id; render(); break;
    case "img": { const p = prod(sel.id); sel.img = +d.i; $("#gmain").innerHTML = `<img src="${esc(p.images[sel.img])}" alt="${esc(p.name)}">`;
      document.querySelectorAll(".thumbs button").forEach((t,i)=>t.setAttribute("aria-current", i===sel.img)); break; }
    case "var": { const p = prod(sel.id); sel.vid = d.id; const v = p.variants.find(x=>x.id===d.id); $("#pprice").textContent = cop(v.price);
      document.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed", o.dataset.id===d.id)); break; }
    case "pq": sel.qty = Math.max(1, sel.qty + (+d.d)); $("#pqty").textContent = sel.qty; break;
    case "add": addToCart(d.id, false); break;
    case "buy": addToCart(d.id, true); break;
    case "cq": { const l = cart.find(x=>x.pid===d.pid && x.vid===d.vid); if(l){ l.qty += +d.d; if(l.qty<=0) cart = cart.filter(x=>x!==l); } saveCart(); render(); break; }
    /* admin */
    case "logout": setAdmin(false); draft=null; render(); break;
    case "atab": aTab = d.id; draft = null; render(); break;
    case "pnew": draft = {_new:true,id:uid(),name:"",categoryId:(D.categories[0]||{}).id||"",familyId:"",aroma:"",colorName:"",color:"#c9b5a0",desc:"",triangle:"",featured:false,active:true,images:[],sizeGuide:"",variants:[{id:uid(),label:"",weight:"",price:"",stock:""}]}; render(); window.scrollTo(0,0); break;
    case "pedit": draft = clone(prod(d.id)); render(); window.scrollTo(0,0); break;
    case "pdup": { const c = clone(prod(d.id)); c.id = uid(); c.name += " (copia)"; c.variants.forEach(v=>v.id=uid()); D.products.push(c); Store.save(D); toast("Producto duplicado"); render(); break; }
    case "pdel": delId = d.id; render(); break;
    case "pdel2": D.products = D.products.filter(p=>p.id!==d.id); cart = cart.filter(l=>l.pid!==d.id); delId=""; Store.save(D); saveCart(); toast("Producto eliminado"); render(); break;
    case "pcancel": draft = null; render(); break;
    case "imgdel": draft.images.splice(+d.i,1); render(); break;
    case "guidedel": draft.sizeGuide = ""; render(); break;
    case "vadd": draft.variants.push({id:uid(),label:"",weight:"",price:"",stock:""}); render(); break;
    case "vdel": draft.variants.splice(+d.i,1); render(); break;
    case "setimgdel": D.settings[d.k] = ""; Store.save(D); render(); break;
    case "ladd": D[d.list].push(d.list==="families"?{id:uid(),name:"Nuevo aroma",color:"#c9b5a0"}:{id:uid(),name:"Nuevo tipo",image:""}); Store.save(D); render(); break;
    case "ldel": D[d.list].splice(+d.i,1); Store.save(D); render(); break;
    case "lmove": { const L = D[d.list], i = +d.i; if(i>0){ [L[i-1],L[i]] = [L[i],L[i-1]]; Store.save(D); render(); } break; }
    case "jcopy": { const t = $("#jsonbox"); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>toast("Copiado"),()=>{document.execCommand("copy");toast("Copiado")}) }catch(_e){ try{document.execCommand("copy");toast("Copiado")}catch(__e){} } break; }
    case "jdl": { const blob = new Blob([JSON.stringify(D)],{type:"application/json"}); const u = URL.createObjectURL(blob); const x = document.createElement("a"); x.href=u; x.download="serenia-datos.json"; x.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); break; }
    case "jimp": { try{ const n = JSON.parse($("#jsonbox").value); if(!n.products||!n.categories||!n.settings) throw 0; D = n; Store.save(D); toast("Datos importados"); render(); }catch(_e){ toast("El texto no es una copia válida."); } break; }
    case "reset": D = seed(); Store.save(D); cart=[]; saveCart(); toast("Datos de ejemplo restaurados"); render(); break;
  }
});
document.addEventListener("input", e => {

  if(t.id==="asq"){ aSearch = t.value; const p = t.selectionStart; render(); const n=$("#asq"); n.focus(); n.setSelectionRange(p,p); return; }

  if(t.dataset.v !== undefined && draft){ draft.variants[+t.dataset.v][t.dataset.k] = t.value; return; }
  if(t.dataset.set){ D.settings[t.dataset.set] = t.type==="number" ? +t.value : t.value; Store.save(D); return; }
  if(t.dataset.list){ D[t.dataset.list][+t.dataset.i][t.dataset.k] = t.value; Store.save(D); return; }
  if(t.id==="bname"||t.id==="bcity"||t.id==="baddr"){ buyer[t.id.slice(1)] = t.value; const w=$("#wabtn"); if(w) w.href = waLink(); }

document.addEventListener("change", async e => {
  const t = e.target;
  if(t.id==="lsort"){ listSort = t.value; render(); return; }
  if(!t.dataset.up) return;
  const files = [...t.files]; if(!files.length) return;
  try{
    if(t.dataset.up==="images"){ for(const f of files) draft.images.push(await readImg(f)); render(); }
    else if(t.dataset.up==="guide"){ draft.sizeGuide = await readImg(files[0],1100); render(); }
    else if(t.dataset.up==="catimg"){ D.categories[+t.dataset.i].image = await readImg(files[0],600); Store.save(D); render(); }
    else if(t.dataset.up==="setimg"){ D.settings[t.dataset.k] = await readImg(files[0],1400); Store.save(D); render(); }
  }catch(_e){ toast("No se pudo leer la imagen."); }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if(f.id==="sform"){ const q = $("#sq").value.trim(); if(q){ searchOpen=false; go("/buscar/"+encodeURIComponent(q)); } }
  else if(f.id==="news"){ toast("¡Gracias por suscribirte!"); f.reset(); }
  else if(f.id==="alogin"){ if($("#apass").value === D.settings.adminPass){ setAdmin(true); render(); } else toast("Clave incorrecta."); }
  else if(f.id==="pform"){
    const d = draft;
    if(!d.name.trim()){ toast("Escribe el nombre del producto."); return; }
    d.variants = d.variants.filter(v=>String(v.label).trim()).map(v=>({...v, price:+v.price||0, weight:v.weight===""?"":+v.weight, stock:v.stock===""?"":+v.stock}));
    if(!d.variants.length){ toast("Agrega al menos una medida con nombre."); d.variants=[{id:uid(),label:"",weight:"",price:"",stock:""}]; render(); return; }
    const isNew = d._new; delete d._new;
    if(isNew) D.products.push(d); else D.products[D.products.findIndex(p=>p.id===d.id)] = d;
    if(Store.save(D)){ draft = null; toast("Producto guardado"); render(); window.scrollTo(0,0); } else { if(isNew) D.products.pop(); d._new = isNew || undefined; }
  }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && (cartOpen||menuOpen)){ cartOpen=false; menuOpen=false; renderLayer(); } });

path = parse(location.hash);
render();
</script>
